<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Card Match Fun!</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #fffae6 0%, #ffeaa7 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bubblegum Sans', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      touch-action: none;
      padding: 10px 12px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      color: #e17055;
      text-shadow: 2px 2px 0px #fff;
      margin-bottom: 6px;
    }

    /* Difficulty & Card Count Selector */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .controls span {
      font-weight: bold;
      color: #2d3436;
      font-size: 0.95rem;
    }

    .btn-chip {
      background: #ffffff;
      border: 2px solid #fdcb6e;
      color: #d63031;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #e17055;
      transition: all 0.15s ease;
    }

    .btn-chip.active {
      background: #e17055;
      color: #ffffff;
      border-color: #d63031;
      box-shadow: 0 1px 0 #b71540;
      transform: translateY(2px);
    }

    /* Game Board Grid Container */
    .game-grid {
      display: grid;
      gap: 8px;
      width: min(94vw, 950px);
      height: min(76vh, 680px);
      perspective: 1000px;
      margin: 0 auto;
      justify-content: center;
      align-content: center;
    }

    /* Adaptive grid styling according to total cards */
    .grid-6 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      max-width: 600px;
      max-height: 440px;
    }
    .grid-12 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      max-width: 720px;
      max-height: 520px;
    }
    .grid-20 {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      max-width: 820px;
      max-height: 580px;
    }
    .grid-30 {
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }
    .grid-50 {
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
    }

    /* Portrait tablet fallback for 50 cards */
    @media (orientation: portrait) and (max-width: 768px) {
      .grid-50 {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(10, 1fr);
      }
    }

    /* Individual Card */
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.35s ease-out;
      cursor: pointer;
      border-radius: 12px;
    }

    /* Flipped (Open) state */
    .card.flipped {
      transform: rotateY(180deg);
    }

    /* Matched state: stays permanently open, highlighted, and disabled */
    .card.matched {
      transform: rotateY(180deg) scale(0.97);
      pointer-events: none;
      animation: matchPop 0.4s ease-out;
    }

    .card.matched .card-front {
      background: #e8f8f5;
      border: 3.5px solid #2ecc71;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.35);
    }

    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.1); }
      100% { transform: rotateY(180deg) scale(0.97); }
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    /* Card Back (Hidden state) */
    .card-back {
      background: linear-gradient(135deg, #0984e3, #74b9ff);
      border: 3px solid #ffffff;
      color: #ffffff;
      font-size: clamp(1.2rem, 3.5vw, 2.5rem);
    }

    /* Card Front (Revealed state) */
    .card-front {
      background: #ffffff;
      border: 3px solid #fdcb6e;
      font-size: clamp(1.4rem, 4vw, 3.2rem);
      transform: rotateY(180deg);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Slightly smaller font for large grids */
    .grid-50 .card-front {
      font-size: clamp(1.1rem, 2.8vw, 1.8rem);
    }
    .grid-50 .card-back {
      font-size: clamp(1rem, 2.2vw, 1.5rem);
    }

    /* Victory Celebration Overlay */
    .win-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .win-modal.active {
      display: flex;
    }

    .win-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #6c5ce7;
      margin-bottom: 20px;
      text-align: center;
      animation: bounce 1s infinite alternate;
    }

    .btn-replay {
      font-size: 1.8rem;
      font-weight: bold;
      padding: 14px 34px;
      background: #00b894;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      box-shadow: 0 6px 0 #008f72, 0 10px 18px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-replay:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #008f72;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    @keyframes popIn {
      0% { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Find the Pairs! 🌟</h1>
    <div class="controls">
      <span>Cards:</span>
      <button class="btn-chip active" onclick="setTotalCards(6)">6</button>
      <button class="btn-chip" onclick="setTotalCards(12)">12</button>
      <button class="btn-chip" onclick="setTotalCards(20)">20</button>
      <button class="btn-chip" onclick="setTotalCards(30)">30</button>
      <button class="btn-chip" onclick="setTotalCards(50)">50</button>
    </div>
  </header>

  <main class="game-grid grid-6" id="grid"></main>

  <div class="win-modal" id="winModal">
    <div class="win-title">🎉 Great Job! ⭐</div>
    <button class="btn-replay" onclick="initGame()">Play Again 🔄</button>
  </div>

  <canvas id="confetti" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:998;"></canvas>

  <script>
    // Web Audio Sound Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const soundFlip = () => playTone(440, 'triangle', 0.08);
    const soundMatch = () => {
      playTone(523.25, 'sine', 0.1);
      setTimeout(() => playTone(659.25, 'sine', 0.18), 100);
    };
    const soundWin = () => {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        setTimeout(() => playTone(freq, 'sine', 0.28), i * 140);
      });
    };

    // Full pool of 25 distinct toddler-friendly emojis (supporting up to 50 cards / 25 pairs)
    const ALL_ITEMS = [
      '🦁', '🐘', '🐶', '🐱', '🐸', 
      '🐼', '🦄', '🚗', '🚀', '🍎', 
      '🍓', '🍌', '🍦', '🌞', '🌈', 
      '⭐', '🎈', '🧸', '🐣', '🐬', 
      '🦖', '🚒', '✈️', '⛵', '🎁'
    ];

    let totalCards = 6;
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let lockBoard = false;

    const grid = document.getElementById('grid');
    const winModal = document.getElementById('winModal');

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setTotalCards(count) {
      totalCards = count;
      document.querySelectorAll('.btn-chip').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.innerText) === count);
      });
      initGame();
    }

    function initGame() {
      winModal.classList.remove('active');
      grid.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      lockBoard = false;

      // Update grid class
      grid.className = `game-grid grid-${totalCards}`;

      const pairCount = totalCards / 2;
      const chosenIcons = shuffle([...ALL_ITEMS]).slice(0, pairCount);
      cards = shuffle([...chosenIcons, ...chosenIcons]);

      cards.forEach((symbol) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.symbol = symbol;

        card.innerHTML = `
          <div class="card-face card-back">⭐</div>
          <div class="card-face card-front">${symbol}</div>
        `;

        card.addEventListener('pointerdown', () => handleCardTap(card));
        grid.appendChild(card);
      });
    }

    function handleCardTap(card) {
      if (lockBoard) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      soundFlip();
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      const isMatch = c1.dataset.symbol === c2.dataset.symbol;

      if (isMatch) {
        setTimeout(() => {
          soundMatch();
          // Keep matched cards open and marked permanently
          c1.classList.add('matched');
          c2.classList.add('matched');
          flippedCards = [];
          matchedPairs++;

          if (matchedPairs === totalCards / 2) {
            setTimeout(triggerWin, 450);
          }
        }, 220);
      } else {
        // Only flip back when they do not match
        lockBoard = true;
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 850);
      }
    }

    function triggerWin() {
      soundWin();
      winModal.classList.add('active');
      fireConfetti();
    }

    function fireConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 70 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 18,
        vy: (Math.random() - 0.8) * 18,
        size: Math.random() * 8 + 5,
        color: ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe'][Math.floor(Math.random() * 5)],
        gravity: 0.32
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          if (p.y < canvas.height) active = true;
        });

        if (active) requestAnimationFrame(render);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      render();
    }

    // Launch game on load
    initGame();
  </script>
</body>
</html>
